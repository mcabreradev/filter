name: Publish to npm (Manual Versioning)

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: 📦 Publish to npm
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: ⎔ Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 20
          scope: '@mcabreradev'
          registry-url: 'https://registry.npmjs.org'

      - name: 📥 Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
          run_install: false

      - name: 🔐 Validate npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NPM_TOKEN secret is not configured."
            exit 1
          fi

          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          printf '%s\n' \
            "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
            "@mcabreradev:registry=https://registry.npmjs.org/" \
            "always-auth=true" > "$NPM_CONFIG_USERCONFIG"

          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=@mcabreradev/filter" >> "$GITHUB_ENV"
          echo "✅ npm registry: $(npm config get registry)"
          echo "✅ scope registry: $(npm config get @mcabreradev:registry)"
          echo "✅ authenticated as: $(npm whoami)"

      - name: 🔎 Verify package scope access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "$PACKAGE_NAME" name >/dev/null 2>&1; then
            echo "✅ Package $PACKAGE_NAME already exists in npm registry."
          else
            echo "⚠️ Package $PACKAGE_NAME is not visible from the registry yet."
            echo "If this is the first publish for the scope, verify the npm account or org permissions for @mcabreradev."
          fi

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build
        run: pnpm run build

      - name: 📋 Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          echo "Build files:"
          ls -la build/

      - name: 🔒 Security audit
        run: pnpm audit --audit-level=high

      - name: 🔍 Running Check/Test Suite
        run: pnpm run check

      - name: 🔍 Determine version bump from PR title or labels
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          VERSION_TYPE=""
          DETECTION_METHOD=""

          # ============================================
          # PASO 1: Intentar detectar por título del PR
          # ============================================
          echo "📋 PR Title: $PR_TITLE"

          # Extraer el tipo (soporta: "type: msg", "type(scope): msg", "type!: msg")
          TYPE=$(echo "$PR_TITLE" | sed -E 's/^([a-zA-Z]+)(\([^)]+\))?[!]?:.*/\1/' | tr '[:upper:]' '[:lower:]')

          # Verificar si tiene "!" para breaking change
          if echo "$PR_TITLE" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            VERSION_TYPE="major"
            DETECTION_METHOD="PR title with breaking change indicator (!)"
            echo "🚨 Detected from title: MAJOR (breaking change '!')"
          elif [ -n "$TYPE" ] && echo "$PR_TITLE" | grep -qE '^[a-zA-Z]+(\([^)]+\))?:'; then
            case "$TYPE" in
              major|breaking)
                VERSION_TYPE="major"
                DETECTION_METHOD="PR title (type: $TYPE)"
                echo "🚨 Detected from title: MAJOR (type: $TYPE)"
                ;;
              minor|feat|feature)
                VERSION_TYPE="minor"
                DETECTION_METHOD="PR title (type: $TYPE)"
                echo "✨ Detected from title: MINOR (type: $TYPE)"
                ;;
              patch|fix|bugfix|hotfix|chore|docs|style|refactor|perf|test|build|ci)
                VERSION_TYPE="patch"
                DETECTION_METHOD="PR title (type: $TYPE)"
                echo "🔧 Detected from title: PATCH (type: $TYPE)"
                ;;
            esac
          fi

          # ============================================
          # PASO 2: Si no se detectó, buscar en labels
          # ============================================
          if [ -z "$VERSION_TYPE" ]; then
            echo "⚠️ No valid conventional commit format in title, checking labels..."

            LABEL_NAMES=$(echo "$PR_LABELS" | jq -r '.[].name' 2>/dev/null || echo "")

            if [ -n "$LABEL_NAMES" ]; then
              echo "🏷️ Labels found: $LABEL_NAMES"

              if echo "$LABEL_NAMES" | grep -q "^major$"; then
                VERSION_TYPE="major"
                DETECTION_METHOD="label"
                echo "🚨 Detected from label: MAJOR"
              elif echo "$LABEL_NAMES" | grep -q "^minor$"; then
                VERSION_TYPE="minor"
                DETECTION_METHOD="label"
                echo "✨ Detected from label: MINOR"
              elif echo "$LABEL_NAMES" | grep -q "^patch$"; then
                VERSION_TYPE="patch"
                DETECTION_METHOD="label"
                echo "🔧 Detected from label: PATCH"
              fi
            else
              echo "⚠️ No labels found"
            fi
          fi

          # ============================================
          # PASO 3: Default a PATCH si no se detectó nada
          # ============================================
          if [ -z "$VERSION_TYPE" ]; then
            VERSION_TYPE="patch"
            DETECTION_METHOD="default (no title format or label found)"
            echo "⚠️ No version detected, defaulting to PATCH"
          fi

          # ============================================
          # Output final
          # ============================================
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Final decision: $VERSION_TYPE"
          echo "📍 Detection method: $DETECTION_METHOD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "type=$VERSION_TYPE" >> $GITHUB_OUTPUT

      - name: 📈 Bump version (local only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version ${{ steps.version.outputs.type }} --no-git-tag-version

      - name: 🔎 Check version doesn't already exist on npm
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          if npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null | grep -q "$NEW_VERSION"; then
            echo "❌ Version $NEW_VERSION already exists on npm. Aborting to avoid duplicate publish."
            exit 1
          fi
          echo "✅ Version $NEW_VERSION is available for publishing."

      - name: 🚀 Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📝 Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"

      - name: 🔄 Push version bump
        run: git push origin main

      - name: 🏷️ Create Git Tag
        run: |
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
